name: Keepalive

# Pings the deployed readiness probe so the Supabase free tier does not pause
# after 7 idle days. /api/ready runs a real database query (unlike /api/health),
# so it counts as activity. Set repository variable APP_URL to the deployed URL.
on:
  schedule:
    # Every 2 days at 08:17 UTC — margin under the 7-day idle window.
    - cron: "17 8 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping readiness probe (touches database)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Fail loudly. A skip here reports green and hides a paused database.
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set." >&2
            echo "Set it with: gh variable set APP_URL --body https://your-app.vercel.app" >&2
            exit 1
          fi
          target="${APP_URL%/}/api/ready"
          echo "Pinging $target"
          body=$(curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 60 "$target")
          echo "$body"
          # The probe returns 503 if the query fails. Check the body also, because
          # an edge error page can return 200 without touching the database.
          case "$body" in
            *'"status":"ready"'*) ;;
            *) echo "Readiness probe did not report ready." >&2; exit 1 ;;
          esac
